name: linux-gcc-x64-asan-ubsan
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  cloud-ci:
    # Pin the runner image to avoid surprise OS migrations (ubuntu-latest moves).
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v2
    - name: install-tools
      run: |
        sudo apt-get update
        sudo apt-get install cmake ninja-build gcc-15 g++-15
    - name: build
      env:
        CC: gcc-15
        CXX: g++-15
        TYPE: Release
      run: |
        $CC --version
        $CXX --version
        mkdir build && cd build
        cmake -GNinja -DCMAKE_BUILD_TYPE=${TYPE} -DIHFT_SANITIZER_ADDRESS=1 -DIHFT_SANITIZER_UB=1 ..
        cmake --build .
    - name: test
      run: cd build && ctest
